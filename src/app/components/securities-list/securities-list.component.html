<div>
  <filter-bar
    [fields]="fields"
    (filterChange)="onFilterChange($event)"
  ></filter-bar>
</div>

<filterable-table
  class="security-list"
  [dataSource]="securities$ | async"
  [isLoading]="loadingSecurities$ | async"
>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let security">{{ security.name }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let security">{{ security.type }}</td>
  </ng-container>

  <ng-container matColumnDef="currency">
    <th mat-header-cell *matHeaderCellDef>Currency</th>
    <td mat-cell *matCellDef="let security">{{ security.currency }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="filterColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: filterColumns"></tr>

  <tr class="mat-row no-data-row" *matNoDataRow>
    <td class="mat-cell" colspan="3">No Data Found</td>
  </tr>
</filterable-table>

<mat-paginator
  [length]="(totalCount$ | async) ?? 0"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 25, 50]"
  (page)="onPage($event)"
></mat-paginator>
