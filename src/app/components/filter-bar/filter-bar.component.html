<div class="filter-bar">
  <form [formGroup]="form">
    <ng-container *ngFor="let field of configs">
      <ng-container [ngSwitch]="field.type">
        <mat-form-field
          *ngSwitchCase="'text'"
          appearance="outline"
          class="filter-field"
        >
          <mat-label>{{ field.label }}</mat-label>
          <input matInput [formControlName]="field.key" />
        </mat-form-field>

        <mat-form-field
          *ngSwitchCase="'select'"
          appearance="outline"
          class="filter-field"
        >
          <mat-label>{{ field.label }}</mat-label>
          <mat-select [formControlName]="field.key">
            <mat-option [value]="null"> {{ field.label }} </mat-option>
            <mat-option
              *ngFor="let option of field.options"
              [value]="option.value"
            >
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field
          *ngSwitchCase="'multiselect'"
          appearance="outline"
          class="filter-field"
        >
          <mat-label>{{ field.label }}</mat-label>
          <mat-select [formControlName]="field.key" multiple>
            <mat-option
              *ngFor="let option of field.options"
              [value]="option.value"
            >
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-checkbox
          *ngSwitchCase="'checkbox'"
          [formControlName]="field.key"
          class="filter-field"
        >
          {{ field.label }}
        </mat-checkbox>
      </ng-container>
    </ng-container>
  </form>
  <div class="filter-actions">
    <button mat-raised-button title="Apply" (click)="onApply()">Apply</button>
    <button mat-raised-button title="Clear" (click)="onClear()">Clear</button>
  </div>
</div>
